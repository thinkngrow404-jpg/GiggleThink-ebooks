<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | GiggleThink</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: #0f0f14;
      color: #fff;
      overflow-x: hidden;
    }

    .container {
      width: 90%;
      max-width: 800px;
      margin: auto;
    }

    /* NAV */
    nav {
      padding: 20px 0;
    }

    .nav-flex {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
    }

    nav h2 {
      font-weight: 600;
    }

    nav ul {
      display: flex;
      list-style: none;
      gap: 20px;
      flex-wrap: wrap;
    }

    nav ul li a {
      text-decoration: none;
      color: #ccc;
      font-size: 14px;
    }

    nav ul li a:hover {
      color: #a855f7;
    }

    /* HEADER */
    .header {
      text-align: center;
      padding: 60px 20px;
    }

    .header h1 {
      font-size: 32px;
      margin-bottom: 10px;
    }

    .header p {
      color: #aaa;
    }

    /* FORM */
    form {
      background: #1a1a24;
      padding: 25px;
      border-radius: 15px;
    }

    .input-group {
      margin-bottom: 15px;
    }

    input, textarea {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: #0f0f14;
      color: #fff;
    }

    textarea {
      min-height: 120px;
      resize: none;
    }

    .btn {
      width: 100%;
      padding: 12px;
      background: #a855f7;
      border: none;
      border-radius: 30px;
      color: #fff;
      cursor: pointer;
      margin-top: 10px;
    }

    .btn:hover {
      background: #9333ea;
    }

    /* EMAIL TEXT */
    .email-box {
      text-align: center;
      margin-top: 20px;
      color: #aaa;
      font-size: 14px;
    }

    footer {
      text-align: center;
      padding: 20px;
      border-top: 1px solid #222;
      margin-top: 40px;
      font-size: 13px;
      color: #777;
    }

  </style>
</head>

<body>

  <!-- NAV -->
  <nav>
    <div class="container nav-flex">
      <h2>GiggleThink</h2>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="ebook.html">Ebook</a></li>
        <li><a href="blog.html">Blog</a></li>
        <li><a href="#">Contact</a></li>
      </ul>
    </div>
  </nav>

  <!-- HEADER -->
  <section class="header">
    <div class="container">
      <h1>Contact Me</h1>
      <p>Have a question or feedback? Send me a message.</p>
    </div>
  </section>

  <!-- FORM -->
  <section class="container">
    
    <!-- 🔥 IMPORTANT: Replace YOUR_EMAIL -->
    <form action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
      
      <div class="input-group">
        <input type="text" name="name" placeholder="Your Name" required>
      </div>

      <div class="input-group">
        <input type="email" name="email" placeholder="Your Email" required>
      </div>

      <div class="input-group">
        <textarea name="message" placeholder="Your Message" required></textarea>
      </div>

      <button type="submit" class="btn">Send Message</button>
    </form>

    <div class="email-box">
      Or email directly: <br>
      <strong>youremail@gmail.com</strong>
    </div>

  </section>

  <!-- FOOTER -->
  <footer>
    © 2026 GiggleThink. All rights reserved.
  </footer>

</body>
</html>
