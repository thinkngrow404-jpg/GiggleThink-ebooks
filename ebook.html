<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>My Ebooks</title>

  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-WE85KYJP0Z"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-WE85KYJP0Z');
  </script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f9;
      text-align: center;
      padding: 30px;
    }
    h1 {
      color: #333;
      margin-bottom: 20px;
    }
    .ebook-container {
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
    }
    .ebook-card {
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      width: 250px;
      padding: 15px;
      transition: transform 0.3s ease;
    }
    .ebook-card:hover {
      transform: scale(1.05);
    }
    .ebook-card .img {
      width: 100%;
      border-radius: 8px;
      height: 300px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 10px;
    }
    .ebook-card h3 {
      margin: 10px 0;
      font-size: 18px;
      color: #444;
    }
    .download-btn {
      display: inline-block;
      margin-top: 10px;
      padding: 10px 15px;
      background: #4CAF50;
      color: white;
      border-radius: 6px;
      text-decoration: none;
      transition: background 0.3s;
      cursor: pointer;
      border: none;
    }
    .download-btn:hover {
      background: #388E3C;
    }

    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0,0,0,0.5);
    }
    .modal-content {
      background-color: white;
      margin: 10% auto;
      padding: 30px;
      border-radius: 12px;
      width: 90%;
      max-width: 400px;
      position: relative;
    }
    .close {
      color: #aaa;
      font-size: 28px;
      cursor: pointer;
      position: absolute;
      right: 15px;
      top: 10px;
    }
    .close:hover {
      color: black;
    }
    .form-group {
      margin-bottom: 20px;
      text-align: left;
    }
    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: #555;
      font-weight: bold;
    }
    .form-group input {
      width: 100%;
      padding: 12px;
      border: 2px solid #ddd;
      border-radius: 6px;
      font-size: 16px;
      box-sizing: border-box;
    }
    .submit-btn {
      width: 100%;
      padding: 12px;
      background: #4CAF50;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
    }
    .submit-btn:hover {
      background: #388E3C;
    }
    .success-message {
      background: #d4edda;
      border: 1px solid #c3e6cb;
      color: #155724;
      padding: 15px;
      border-radius: 6px;
      margin-bottom: 20px;
      display: none;
    }
    .download-section {
      display: none;
      margin-top: 20px;
    }
    .final-download-btn {
      display: inline-block;
      padding: 15px 25px;
      background: #007bff;
      color: white;
      text-decoration: none;
      border-radius: 6px;
      font-size: 18px;
    }
    .final-download-btn:hover {
      background: #0056b3;
    }
  </style>
</head>
<body>

<h1>📚 My Free Ebooks</h1>

<div class="ebook-container">

  <!-- Ebook 1 -->
  <div class="ebook-card">
    <div class="img" style="background: linear-gradient(135deg, #667eea, #764ba2);">
      Master AI
    </div>
    <h3>Master AI For Daily Productivity</h3>
    <button class="download-btn"
      onclick="openModal('Master AI For Daily Productivity','ebook1.pdf')">
      📥 Get Free Ebook
    </button>
  </div>

  <!-- Ebook 2 -->
  <div class="ebook-card">
    <div class="img" style="background: linear-gradient(135deg, #f093fb, #f5576c);">
      Intuition
    </div>
    <h3>The Science of Intuition</h3>
    <button class="download-btn"
      onclick="openModal('The Science of Intuition','ebook2.pdf')">
      📥 Get Free Ebook
    </button>
  </div>

  <!-- Ebook 3 -->
  <div class="ebook-card">
    <div class="img" style="background: linear-gradient(135deg, #4facfe, #00f2fe);">
      Psychology
    </div>
    <h3>What We Do & Why We Do</h3>
    <button class="download-btn"
      onclick="openModal('What We Do & Why We Do','ebook3.pdf')">
      📥 Get Free Ebook
    </button>
  </div>

  <!-- Ebook 4 -->
  <div class="ebook-card">
    <div class="img" style="background: linear-gradient(135deg, #ff9a9e, #fad0c4);">
      Thinking Clearly
    </div>
    <h3>Thinking Clearly</h3>
    <button class="download-btn"
      onclick="openModal('Thinking Clearly','ebook4.pdf')">
      📥 Get Free Ebook
    </button>
  </div>

</div>

<!-- Modal -->
<div id="emailModal" class="modal">
  <div class="modal-content">
    <span class="close" onclick="closeModal()">&times;</span>
    <h2>📖 Get Your Free Ebook</h2>
    <p id="modalEbookTitle" style="font-weight:bold;color:#4CAF50;"></p>

    <div class="success-message" id="successMessage">
      ✅ Email submitted successfully! Your download is ready below.
    </div>

    <form id="emailForm">
      <div class="form-group">
        <label>Your Name *</label>
        <input type="text" id="userName" required>
      </div>

      <div class="form-group">
        <label>Email Address *</label>
        <input type="email" id="userEmail" required>
      </div>

      <button type="submit" class="submit-btn">
        📧 Get My Free Ebook
      </button>
    </form>

    <div class="download-section" id="downloadSection">
      <h3>🎉 Thank you!</h3>
      <a href="#" class="final-download-btn"
         id="finalDownloadBtn" target="_blank">
        📥 Download Now
      </a>
    </div>
  </div>
</div>

<script>
let currentEbookUrl = '';

function openModal(title, url){
  document.getElementById('emailModal').style.display='block';
  document.getElementById('modalEbookTitle').textContent=title;
  currentEbookUrl=url;
}

function closeModal(){
  document.getElementById('emailModal').style.display='none';
}

document.getElementById('emailForm').addEventListener('submit',function(e){
  e.preventDefault();
  document.getElementById('emailForm').style.display='none';
  document.getElementById('successMessage').style.display='block';
  document.getElementById('downloadSection').style.display='block';
  document.getElementById('finalDownloadBtn').href=currentEbookUrl;
});
</script>

</body>
</html>
